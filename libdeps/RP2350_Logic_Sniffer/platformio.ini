; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = picosdk
lib_deps = RP2350_Logic_Sniffer
build_flags =
    -Iinclude
    -ggdb -g3 -Os
    -DPICO_STDIO_USB=1
    -DPICO_STDIO_ENABLE_CRLF_SUPPORT=0   ; Disable CR/LF transformation in pico-stdio because we pass binary data
    -DSNIFFER_DISABLE_LOG=1   ; Log messages to stdio would mess up our output
    -DSNIFFER_BLOCKCOUNT=512  ; This must be power of 2
    -DSNIFFER_BLOCKSIZE=960   ; Use almost the full 512 kB RAM for buffers, 512 * 960 = 480 kB
    -DSNIFFER_PINCOUNT=23     ; Pico2 has GPIO0-GPIO22 easily accessible
