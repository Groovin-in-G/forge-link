;========================================
; ZuluSCSI RP2350 hardware platform, based on the Raspberry Pi foundation RP2350 microcontroller
[env:ZuluSCSI_Blaster]
extends = env:ZuluSCSI_RP2MCU
board = rhc_zuluscsi_blaster
linker_script_template = lib/ZuluSCSI_platform_RP2MCU/rp23xx-template.ld
ldscript_bootloader = lib/ZuluSCSI_platform_RP2MCU/rp23xx_btldr.ld
lib_deps =
    ${env:ZuluSCSI_RP2MCU.lib_deps}
    SDIO_RP2350=https://github.com/rabbitholecomputing/SDIO_RP2350#1.0.6
    RP2350_Logic_Sniffer=https://github.com/rabbitholecomputing/RP2350_Logic_Sniffer#1.1.0
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    ZuluSCSI_UI_RP2MCU
    ZuluSCSI_audio_RP2MCU
    ZuluSCSI_WebUI_RP2MCU
build_unflags =
    -DZULUSCSI_NETWORK
    -DZULUSCSI_DAYNAPORT
    -DNETWORK_PACKET_QUEUE_SIZE=40
    -DENABLE_AUDIO_OUTPUT
    -DENABLE_AUDIO_OUTPUT_I2S
    -DZULUSCSI_RM2
    ; ⚠ THIS UNFLAG CANNOT WORK, AND THAT IS HARMLESS (measured 2026-09-24). The arduino-pico
    ; framework's own builder appends CYW43_PIO_CLOCK_DIV_DYNAMIC=1 to EVERY build
    ; (framework-arduinopico/tools/platformio-build.py:308, called unconditionally at :336), after
    ; this list has been applied, so no line here can remove it. It only shapes the Wi-Fi driver's
    ; headers; the precompiled driver is linked identically (126 cyw43 symbols) in every env.
    -DCYW43_PIO_CLOCK_DIV_DYNAMIC=1
build_flags =
    ${env:ZuluSCSI_RP2MCU.build_flags}
    -DZULUSCSI_BLASTER
    ; Forge Link: this branch's Blaster build IS the probe. Compiles out the
    ; initiator imaging scan and USB MSC initiator, arms the USB bridge.
    -DFORGE_LINK_PROBE
    ; N6 probe-bulk slice 1 (frame item 1): the vendor-bulk
    ; USB channel on the PROBE build too, so an EXEC's data-out rides bulk instead of CDC.
    ; ⛔ target7 EXTENDS this env and inherits every flag here, so it UNFLAGS this one below.
    -DFORGE_LINK_BULK
    ; SCSI BUS SNIFFER BUFFER 32 KB -> 4 KB (decided 2026-10-08: shrink for now,
    ; but keep the code in case it is ever needed again). The RP2350_Logic_Sniffer lib's
    ; capture buffer g_sniffer_buf is SNIFFER_BLOCKCOUNT x SNIFFER_BLOCKSIZE (1024 B) of .bss, default 32
    ; blocks behind an #ifndef (lib/ZuluSCSI_platform_RP2MCU/rp2350_sniffer_config.h:28-30); 4 blocks =
    ; 4,096 B, freeing 28,672 B of heap in EVERY env that takes these flags (this probe env and every
    ; ForgeLink_* env, which all extend ${env:ZuluSCSI_Blaster.build_flags}). Must be a power of two (the
    ; lib static_asserts it, rp2350_sniffer.c:38). Every line of sniffer code stays compiled; it still
    ; runs on demand with ini [SCSI] sniffer=1 (src/ZuluSCSI.cpp), it just overruns sooner on a busy bus
    ; (overruns are logged and marked in the capture). The RAM funds the timed-note queue
    ; (docs/note-at.md §12). TO BRING THE FULL 32 KB BACK: delete this one -D line.
    -DSNIFFER_BLOCKCOUNT=4
    ; N4: our own copy of TinyUSB's cdc_device.c is compiled from src/tinyusb_override/ so the
    ; buffer sizes can actually change (the framework's copy is precompiled into libpico.a).
    ; It needs tinyusb's own include roots, which the project does not otherwise carry.
    -I$PROJECT_PACKAGES_DIR/framework-arduinopico/pico-sdk/lib/tinyusb/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinopico/pico-sdk/lib/tinyusb/src/class/cdc
    -I$PROJECT_PACKAGES_DIR/framework-arduinopico/pico-sdk/lib/tinyusb/src/portable/raspberrypi/rp2040
    -DZULUSCSI_MCU_RP23XX
    -DENABLE_AUDIO_OUTPUT
    -DENABLE_AUDIO_OUTPUT_I2S
    -DSD_USE_RP2350_SDIO
    -DZULUSCSI_NETWORK
    -DZULUSCSI_DAYNAPORT
    -DNETWORK_PACKET_QUEUE_SIZE=40
    -DCYW43_PIO_CLOCK_DIV_DYNAMIC=1
    -DZULUSCSI_RM2
; Use the -Wl lines below as a "build_flags" entry if you wish to make a map file
; to check memory locations of the compiled code. 
;    -Wl,-Map="${platformio.build_dir}/${this.__env__}/firmware.map"
;    -Wl,-cref
	-DCONTROL_BOARD
    -DSSD1306_NO_SPLASH
    -DZULUCONTROL_FIRMWARE


