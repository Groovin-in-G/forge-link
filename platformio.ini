; Forge Link TARGET build (contact-1): stock disk role; ID 7 reports as a processor and
; debug logging is forced on, to capture what the Akai S1000 sends to its remote ID.
[env:ForgeLink_Blaster_target7]
extends = env:ZuluSCSI_Blaster
build_unflags =
    -DFORGE_LINK_PROBE
    ; The probe env carries the vendor-bulk flag since N6 probe-bulk slice 1; target7 has no
    ; frame transport at all, so the flag is removed here rather than inherited.
    -DFORGE_LINK_BULK
    -DZULUSCSI_NETWORK
    -DZULUSCSI_DAYNAPORT
    -DNETWORK_PACKET_QUEUE_SIZE=40
    -DENABLE_AUDIO_OUTPUT
    -DENABLE_AUDIO_OUTPUT_I2S
    -DZULUSCSI_RM2
    -DCYW43_PIO_CLOCK_DIV_DYNAMIC=1
build_flags =
    ${env:ZuluSCSI_Blaster.build_flags}
    -DFORGE_LINK_TARGET7
    -DFORGE_LINK_CALLBACK

; ============================================================================================
; Forge Link UNIFIED build - the DIP-ROLE UNION (2026-09-30).
;
; ONE binary, flashed once, whose role FOLLOWS THE INITIATOR DIP at boot:
;   switch ON  = the RAM bridge (the probe: ZuluSCSI_Blaster's -DFORGE_LINK_PROBE dispatcher)
;   switch OFF = the disk + block injector (ForgeLink_Blaster_inject's dispatcher)
; Flip the switch with the board powered down and restart, instead of reflashing. The role was
; always chosen at runtime by the DIP (platform_init); this env only compiles both dispatchers
; into one image. The source spells the union FL_UNIFIED (ForgeLink_probe.h), derived from
; PROBE + INJECT - there is no third define.
;
; ⛔ It EXTENDS ZuluSCSI_Blaster, NOT ForgeLink_Blaster_inject: inject's build_unflags strip
; -DFORGE_LINK_PROBE and unflags apply after flags, so a stanza extending inject can never keep it.
; ⛔ WHAT THIS ENV DELIBERATELY DOES NOT DEFINE:
;   - FORGE_LINK_DBUF (the double-buffered USB OUT experiment; compiled OUT, risk R6)
;   - FORGE_LINK_INJECT_TEST (the STALL verb) - this is a build that may be kept
;   - FORGE_LINK_TARGET7 / FORGE_LINK_CALLBACK (the ID-7 peer; the paused 2026-09-22 union)
;   - the network / audio / RM2 names below
; It KEEPS FORGE_LINK_PROBE, so the upstream imaging initiator stays compiled OUT in both roles.
;
; ⛔ ALL ITS CODE RUNS FROM RAM, LIKE EVERY OTHER ENV (decided 2026-09-30: all fast, 30 KB
; is fine). Lever L3 - the two role dispatchers' code in XIP flash, selected in rp23xx-template.ld by
; a glob on this env's build directory - is REVERTED, so nothing keys on this env's name any more.
; The price is the free heap: this env's floor is 29,500 B (not the injection builds' 34,000), the
; number accepted. ⚠ The template's `*spi*`/`*USB*` flash rules still match any env whose NAME
; contains those letters (S0) - never give an env such a name. The guard is
; tools/tests/test_fl_unified.py's ELF test (dispatchers and IRQ-reachable functions in RAM, heap
; over 29,500 B) - run it after any rename.
[env:ForgeLink_Blaster_unified]
extends = env:ZuluSCSI_Blaster
build_unflags =
    -DFORGE_LINK_DBUF
    -DZULUSCSI_NETWORK
    -DZULUSCSI_DAYNAPORT
    -DNETWORK_PACKET_QUEUE_SIZE=40
    -DENABLE_AUDIO_OUTPUT
    -DENABLE_AUDIO_OUTPUT_I2S
    -DZULUSCSI_RM2
    -DCYW43_PIO_CLOCK_DIV_DYNAMIC=1
build_flags =
    ${env:ZuluSCSI_Blaster.build_flags}
    -DFORGE_LINK_INJECT
    ; TQ2 (approved 2026-10-08): the board-clock timed release of live MIDI -
    ; frames 0x10-0x13, caps:note-at in the HELLO ident, EXEC admission while ARMED. Inert until a host
    ; ARMs it (§1). Inherited by the two stamps envs below; no other env carries it, and a build without
    ; it answers 0x10-0x13 with FF exactly as before. Code: src/ForgeLink_noteat*.
    -DFORGE_LINK_NOTE_AT
    ; QX1 (PART 2 of the 36 h run): the SHIP build's small EXECs drop
    ; their "EXEC id" / "EXEC done" UART lines (~2.3 ms each) and a DEBUG DIP no longer forces an SD log save
    ; every bridge pass. A failure still logs. ⛔ The stamps envs below inherit this line and the bench-trace
    ; UF2 (this env + -DFORGE_LINK_EXEC_TRACE) carries it too, but src/ForgeLink_probe.h derives
    ; FL_RELEASE_QUIET_EXEC only when neither the trace nor the stamps is on, so every bench build is unchanged.
    -DFORGE_LINK_RELEASE_QUIET_EXEC

; ============================================================================================
; ⛔ DSP2 · BENCH ONLY, NEVER SHIPS: the unified bench-trace build plus per-EXEC MICROSECOND STAMPS
; (split a link note's spread between the USB/host side and
; the SCSI exchange). The same union and flags as the bench-trace UF2 (`unified-bench-trace-*`,
; env ForgeLink_Blaster_unified + -DFORGE_LINK_EXEC_TRACE, the per-EXEC trace ON), plus
; -DFORGE_LINK_STAMPS: src/ForgeLink_stamps.{h,cc}, the FL_T_STAMPS read (0x0D), the HELLO ident's
; stamps:on token. tools/fl_release_gate.py refuses this env, that token and its marker string.
;
; THE RAM IT COSTS IS PAID HERE: the ring is FL_STAMPS_RING (128) x 36 B = 4,608 B of .bss, and the
; unified bench-trace ELF had only ~1.6 KB over the 29,500 B floor. So this env halves the
; USB/SD log ring (LOGBUFSIZE 8192 -> 4096, still a power of two, ZuluSCSI_config.h), which costs
; log lines when a burst outruns the pump - never a stall: the log drops its oldest bytes
; (ZuluSCSI_log.cpp). Log-line timing (the blocking UART, the part the trace measures) is unchanged.
; ⚠ The env name must never contain spi / USB / libc (the template's flash globs, S0).
[env:ForgeLink_Blaster_unified_stamps]
extends = env:ForgeLink_Blaster_unified
build_flags =
    ${env:ForgeLink_Blaster_unified.build_flags}
    -DFORGE_LINK_EXEC_TRACE
    -DFORGE_LINK_STAMPS
    -DLOGBUFSIZE=4096

; ⛔ DSP2 QUIET · BENCH ONLY, NEVER SHIPS - THE ONE THAT ANSWERS THE SHIP QUESTION. The release/ship-shaped
; union (ForgeLink_Blaster_unified, trace OFF, exactly what `unified-release-*` is built from) plus
; -DFORGE_LINK_STAMPS and nothing else. 's 4.55 ms p99 spread is the RELEASE build's; with the trace
; on, its blocking UART lines (~10 ms a note) sit inside arb/cmd/data/status/free and swamp it.
; The trace-on env above stays as a spare comparison. The gate refuses this one too (marker, flag, token).
; LOGBUFSIZE halved as above, MEASURED: with the default 8192 log ring this env's free heap is 26,180 B
; (nm __HeapLimit - __end__, 2026-10-08), 3,320 B under the 29,500 B floor. (Before. With the sniffer
; at 4 blocks, above, this env as written - LOGBUFSIZE 4096 - MEASURED 30,532 -> 59,508 B, 2026-10-08.)
[env:ForgeLink_Blaster_unified_stamps_quiet]
extends = env:ForgeLink_Blaster_unified
build_flags =
    ${env:ForgeLink_Blaster_unified.build_flags}
    -DFORGE_LINK_STAMPS
    -DLOGBUFSIZE=4096


; ⛔ WMARK · BENCH ONLY, NEVER SHIPS ( C10, 2026-10-12: test on the release firmware).
; The ship union (trace OFF, release-quiet EXECs) plus ONE "FL WMARK rx <ms> out <n> sum <c>" line per completed
; MIDI write (0C), so WIRE1 proves delivery and lateness on the build that ships. HELLO says mark:on; the gate
; refuses this env (flag, token, string). Costs ~0.25 ms of UART per MIDI write, nothing else.
[env:ForgeLink_Blaster_unified_wmark]
extends = env:ForgeLink_Blaster_unified
build_flags =
    ${env:ForgeLink_Blaster_unified.build_flags}
    -DFORGE_LINK_WRITE_MARK

; ============================================================================================
; R1 (2026-10-12, midi's fallback): the SHIP build with NOTE_AT compiled OUT. The release gate refuses any
; caps:note-at UF2 until a TQ4 pass is recorded (docs/note-at.md §14, a 12-cell metal gate incl. USB pulls and
; XL power cycles), and midi's B10 keeps NOTE_AT off on the host, so this is the build that can ship today.
; A build without the flag answers frames 0x10-0x13 with FF (the env comment above). Everything else = ship env.
[env:ForgeLink_Blaster_unified_nonoteat]
extends = env:ForgeLink_Blaster_unified
; ⛔ build_unflags REPLACES the parent's list (it is not merged), so the ship env's list is carried in first -
; a bare `build_unflags = -DFORGE_LINK_NOTE_AT` turned networking + audio back on and overran RAM by ~71 KB.
build_unflags =
    ${env:ForgeLink_Blaster_unified.build_unflags}
    -DFORGE_LINK_NOTE_AT

; ⛔ BENCH ONLY · SILENT-X FAST-WRAP (2026-10-16): the ship build plus a timer preset 5 min before the
; 32-bit microsecond wrap at boot (lib/ZuluSCSI_platform_RP2MCU/ZuluSCSI_platform.cpp platform_init). Never shipped.
[env:ForgeLink_Blaster_unified_nonoteat_fastwrap]
extends = env:ForgeLink_Blaster_unified_nonoteat
build_flags =
    ${env:ForgeLink_Blaster_unified.build_flags}
    -DFL_FASTWRAP_TEST
    -DFL_SILENTX_DIAG

; ⛔ BENCH ONLY · SILENT-X DIAG (LAND-R7, 2026-10-19): the ship build plus -DFL_SILENTX_DIAG, the 84-byte STATUS
; with the SILENT-X counters after r7's frozen 24 (src/ForgeLink_bulk_policy.h; read by scripts/silentx-*.py).
; The ship env above never carries the flag (tools/tests/test_n6_pair.py pins it). Never shipped.
[env:ForgeLink_Blaster_unified_nonoteat_silentx]
extends = env:ForgeLink_Blaster_unified_nonoteat
build_flags =
    ${env:ForgeLink_Blaster_unified.build_flags}
    -DFL_SILENTX_DIAG

; ⛔ BENCH ONLY · RX-SLOW RECEIVE-PATH STAMPS (2026-10-22): the SHIP build
; (NOTE_AT off, trace off, release-quiet EXECs: build 3191's union) plus -DFL_RXSTAMP and nothing else - a .bss ring of
; board-us events along the vendor-bulk receive path (USB IRQ OUT/IN complete, commit, OUT re-arm, park, pick/done,
; reply, the reply's log flush) and the periodic board jobs that could hold it (main-loop gaps, SD log save, CDC log
; pump + platform poll, SD poll), read after a run by FL_T_RXSTAMP 0x0E (src/ForgeLink_rxstamp.h,
; scripts/rx-slow.py). Unlike the stamps envs it does NOT derive the noisy EXEC: the timing is the ship build's.
; Says rxstamp:on; the gate refuses the flag, the token and the marker. Never shipped.
[env:ForgeLink_Blaster_unified_nonoteat_rxstamp]
extends = env:ForgeLink_Blaster_unified_nonoteat
build_flags =
    ${env:ForgeLink_Blaster_unified.build_flags}
    -DFL_RXSTAMP

; ============================================================================================
; Forge Link BLOCK INJECTION build.
;
; The stock DISK role, plus the framed USB transport and the block verbs. The Mac writes a run
; of sectors into a served image while the sampler keeps its disks - no card-reader mode, no
; 59 s mode switch, no role switching.
;
; ⛔ WHAT THIS ENV DELIBERATELY DOES NOT DO:
;   - it does NOT define FORGE_LINK_PROBE, so the initiator role is never forced and the
;     bridge/EXEC path is refused. One role, chosen at boot, never switched.
;   - it does NOT define FORGE_LINK_DBUF. The double-buffered USB OUT experiment wedged the
;     board four times and is compiled OUT, not defaulted off (risk R6).
;   - it does NOT define FORGE_LINK_INJECT_TEST, so the STALL verb is absent from the binary.
;     Build ForgeLink_Blaster_inject_test for the M1 measurement, and do not keep it.
[env:ForgeLink_Blaster_inject]
extends = env:ZuluSCSI_Blaster
build_unflags =
    -DFORGE_LINK_PROBE
    -DFORGE_LINK_DBUF
    -DZULUSCSI_NETWORK
    -DZULUSCSI_DAYNAPORT
    -DNETWORK_PACKET_QUEUE_SIZE=40
    -DENABLE_AUDIO_OUTPUT
    -DENABLE_AUDIO_OUTPUT_I2S
    -DZULUSCSI_RM2
    -DCYW43_PIO_CLOCK_DIV_DYNAMIC=1
build_flags =
    ${env:ZuluSCSI_Blaster.build_flags}
    -DFORGE_LINK_INJECT
    ; N6 step 3: the vendor-bulk USB channel. On BOTH injection envs (frame Q2) - the bench
    ; build has always been inject_test, so flagging only `inject` would leave the bench with
    ; no bulk pipe on the build it actually flashes. Without this flag not one line of
    ; ForgeLink_bulk* is compiled, which is what keeps the other envs byte-identical.
    -DFORGE_LINK_BULK

; ⛔ TEST BUILD ONLY. Adds the STALL verb, which DELIBERATELY DELAYS THE SAMPLER at bus-free so
; M1 can find the first delay the S1000 does not tolerate. It announces itself in the boot
; banner. A session never ends on this build; it never ends on any Forge Link build.
[env:ForgeLink_Blaster_inject_test]
extends = env:ForgeLink_Blaster_inject
build_flags =
    ${env:ForgeLink_Blaster_inject.build_flags}
    -DFORGE_LINK_INJECT_TEST
